# fluxworm pipeline configuration.
# All paths are resolved relative to `data_dir` unless absolute. Override
# `data_dir` with the FLUXWORM_DATA_DIR environment variable to run this
# pipeline outside the original author's machine (no Colab/Drive paths).

data_dir: "../.."   # config.yaml lives in core/config/, so ../.. reaches the project root

paths:
  model_xml: "fluxworm_iCEL_models/iCEL1314.xml"
  series_matrix: "master_data_set/GSE52340_series_matrix.txt.gz"
  results_dir: "core/results"
  lifespan_reference: "core/data/lifespan_reference.csv"   # measured lifespans, used for validation

genotypes:
  reference: "wild type"
  mutants:
    - "rsks-1"
    - "daf-2"
    - "daf-2 rsks-1"
    - "daf-16; daf-2 rsks-1"
  # Expected sample counts per genotype, verified against the real GSE52340
  # header rows (!Sample_characteristics_ch1, "genotype: ..." field). The
  # pipeline raises an error if the parsed file does not match this exactly.
  expected_counts:
    "wild type": 9
    "rsks-1": 9
    "daf-2": 9
    "daf-2 rsks-1": 10
    "daf-16; daf-2 rsks-1": 10

differential_expression:
  log2fc_threshold: 0.585   # log2(1.5)
  qvalue_threshold: 0.05

constraints:
  min_scale: 0.1
  max_scale: 10.0
  # Each reaction's limit is its wild-type capacity times the gene score. The
  # capacity is the most flux the reaction carries in any wild-type solution
  # reaching this fraction of maximum growth.
  #   1.0 = no spare capacity: wild type has just enough enzyme for full growth,
  #         so a down-regulated enzyme on an essential pathway limits growth.
  #   0.9 = the previous setting. It left so much headroom that realistic
  #         fold changes never limited anything (growth within 0.12% of wild type).
  reference_fraction_of_optimum: 1.0

fba:
  biomass_reaction: "BIO0010"
  solver: null   # null = cobra default (glpk via swiglpk)

aging:
  stress_subsystem_keywords:
    - "Fatty acid"
    - "Lipid"
  # Lifespan = (growth vs wild type) ^ -lifespan_exponent. Fixed, not fitted to the
  # lifespan data; the pipeline reports what a fitted value would be.
  lifespan_exponent: 1.0
  max_lifespan_scale: 10.0
  gompertz_B: 0.01
  wt_gompertz_C: 0.10
